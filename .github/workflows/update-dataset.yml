name: Update Kaggle datasets

on:
  schedule:
    - cron: "23 1 * * *" # daily at 01:23 UTC (08:23 WIB)
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  update:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false # one dataset failing must not stop the others
      matrix:
        # Add a dataset here once it has been checked against real data.
        dataset: [defi]
    concurrency:
      group: update-${{ matrix.dataset }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape and publish ${{ matrix.dataset }} to Kaggle
        env:
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_DATASET_PUBLIC: ${{ vars.KAGGLE_DATASET_PUBLIC }}
        run: python -m kaggle_pipeline ${{ matrix.dataset }}
