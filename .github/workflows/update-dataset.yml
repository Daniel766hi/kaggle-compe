name: Update Kaggle datasets

on:
  schedule:
    - cron: "23 1 * * *" # daily at 01:23 UTC (08:23 WIB)
  workflow_dispatch: # manual run from the Actions tab
    inputs:
      dataset:
        description: "Run only this dataset (leave empty for all scheduled datasets)"
        required: false
        default: ""
      dry_run:
        description: "Dry run: build the files but don't upload to Kaggle"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  update:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120 # the weekly movie rebuild queries Wikidata for ~25k films
    strategy:
      fail-fast: false # one dataset failing must not stop the others
      matrix:
        # Scheduled datasets: add one here once it has been checked against real data.
        dataset: ${{ fromJSON(inputs.dataset && format('["{0}"]', inputs.dataset) || '["defi", "idn-air-quality", "idn-fires", "idn-politics", "idn-weather", "idr-fx", "movies"]') }}
    concurrency:
      group: update-${{ matrix.dataset }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape and publish ${{ matrix.dataset }} to Kaggle
        env:
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_DATASET_PUBLIC: ${{ vars.KAGGLE_DATASET_PUBLIC }}
          GDELT_BUDGET_S: ${{ inputs.dry_run && '240' || '' }} # short GDELT backfill in dry runs
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          FIRMS_BUDGET_S: ${{ inputs.dry_run && '240' || '' }} # short FIRMS backfill in dry runs
        run: python -m kaggle_pipeline ${{ matrix.dataset }} ${{ inputs.dry_run && '--dry-run' || '' }}
