<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Office</title>
<style>
  :root { --bg: #f6f4ef; --panel: #fff; --ink: #1f2328; --muted: #6b7280; --line: #e5e1d8; --you: #2563eb; --bad: #dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171a; --panel: #1d2024; --ink: #e8eaed; --muted: #9aa0a6; --line: #2e3237; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  form { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: 100%; max-width: 340px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  input, button { font: inherit; width: 100%; box-sizing: border-box; border-radius: 10px; padding: 10px 12px; }
  input { border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin-bottom: 12px; }
  button { border: 0; background: var(--you); color: #fff; cursor: pointer; }
  .bad { color: var(--bad); }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>🏢 AI Office</h1>
  <p id="note">Enter the office password. It's in the office window on your computer (and in the .env file as OFFICE_PASSWORD).</p>
  <input type="password" name="password" autocomplete="current-password" placeholder="Password" required autofocus>
  <button type="submit">Open the office</button>
</form>
<script>
  const q = new URLSearchParams(location.search), note = document.getElementById("note");
  if (q.has("wrong")) { note.textContent = "That password isn't right. Try again."; note.className = "bad"; }
  if (q.has("wait")) { note.textContent = "Too many tries. Wait a minute, then try again."; note.className = "bad"; }
</script>
</body>
</html>
