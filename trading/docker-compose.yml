# Freqtrade (https://github.com/freqtrade/freqtrade), the open-source crypto trading bot, in
# PAPER TRADING mode: real live prices, fake money. Use trading.cmd / trading.ps1 to run it.
services:
  freqtrade:
    image: freqtradeorg/freqtrade:2026.9
    restart: unless-stopped
    container_name: freqtrade
    volumes:
      - "./user_data:/freqtrade/user_data"
    env_file:
      - .env  # the dashboard password, made by `trading.ps1 setup` (never committed)
    ports:
      - "127.0.0.1:8080:8080"  # the FreqUI dashboard, on this computer only
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/paper_trades.sqlite
      --config /freqtrade/user_data/config.json
      --strategy NostalgiaForInfinityX8
